<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a2d">
<title>Second Iseka Online — 3D Fantasy Prototype</title>
<style>
:root{--gold:#f2d18a;--panel:rgba(12,22,39,.91);--line:rgba(242,209,138,.42);--text:#f4ead7}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fc4e6;color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#world{position:fixed;inset:0;width:100%;height:100%;display:block}
#top{position:fixed;top:env(safe-area-inset-top,8px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px;box-shadow:0 7px 22px #07101e66;backdrop-filter:blur(9px)}
#status{width:min(245px,65vw)}#charname{font-weight:900;color:#ffe2a2;letter-spacing:.3px}.small{font-size:11px;color:#c6d1df}
.bar{height:8px;background:#060d18;border-radius:20px;overflow:hidden;margin-top:5px;border:1px solid #ffffff20}.fill{height:100%;width:100%}.hp{background:linear-gradient(90deg,#b9263b,#ff7474)}.mp{background:linear-gradient(90deg,#176cc5,#72c9ff)}.xp{background:linear-gradient(90deg,#a67b24,#ffe18b)}
#worldname{text-align:center;font-weight:800;color:#ffe3a4;font-size:12px;letter-spacing:1px}
#topright{display:flex;gap:6px;pointer-events:auto}button{font:inherit;color:var(--text);border:1px solid var(--line);border-radius:10px;background:linear-gradient(145deg,#263a58,#111d32);padding:9px 11px;font-weight:750;box-shadow:0 4px 12px #0005}button:active{transform:scale(.96)}
#menu{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;max-width:96vw;overflow-x:auto;padding:5px}
#menu button{min-width:62px;padding:8px 9px;font-size:11px}#menu button b{display:block;color:var(--gold);font-size:17px}
#joy{position:fixed;left:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;border:2px solid #f4d99a99;background:radial-gradient(circle,#334a6d99,#091326c9);box-shadow:0 5px 20px #0008;touch-action:none}
#joy:before{content:"";position:absolute;inset:31px;border:1px solid #f4d99a55;border-radius:50%}
#stick{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#ffedbd,#bd873b);border:2px solid #fff2cf;box-shadow:0 3px 12px #0009;pointer-events:none}
#actions{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,58px);gap:9px}
.skill{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#49658d,#111b30);border:2px solid #e9c777;color:#ffe5aa;font-size:20px}
#hint{position:fixed;top:76px;left:50%;transform:translateX(-50%);background:#101a2dc9;border:1px solid #f2d18a66;border-radius:30px;padding:6px 12px;font-size:11px;white-space:nowrap;pointer-events:none}
#window{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:72vh;overflow:auto;padding:16px;z-index:10}
#window h2{margin:0 0 12px;color:#ffe0a0;font-size:19px}#window .close{float:right}#windowContent{line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{padding:10px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff0b;text-align:center}.tile strong{display:block;color:#ffe0a0;font-size:20px}
#toast{position:fixed;left:50%;top:118px;transform:translateX(-50%);background:#101a2de8;border:1px solid var(--line);border-radius:20px;padding:8px 14px;display:none;z-index:20}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#82bce2,#243d4d);z-index:30;text-align:center}
#loading .card{background:#101a2de8;border:1px solid var(--line);border-radius:18px;padding:24px;max-width:85vw}
#loading h1{color:#ffe0a0;margin:0 0 8px;font-family:Georgia,serif}
@media(min-width:800px){#joy{left:28px;bottom:28px}#actions{right:28px;bottom:28px}#menu{bottom:14px}#hint{top:16px}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="top">
 <div id="status" class="panel">
  <div id="charname">Adventurer <span class="small">Lv. 1 · Novice</span></div>
  <div class="small">HP <span id="hpnum">100/100</span></div><div class="bar"><div id="hpbar" class="fill hp"></div></div>
  <div class="small">MP <span id="mpnum">60/60</span></div><div class="bar"><div id="mpbar" class="fill mp" style="width:100%"></div></div>
  <div class="small">EXP <span id="xpnum">0/100</span></div><div class="bar"><div id="xpbar" class="fill xp" style="width:0%"></div></div>
 </div>
 <div id="worldname" class="panel">ELDERWOOD FRONTIER</div>
 <div id="topright"><button onclick="showPanel('Map')">🗺️</button><button onclick="showPanel('Menu')">☰</button></div>
</div>
<div id="hint">Joystick / WASD untuk bergerak · dekati monster untuk menyerang</div>
<div id="joy"><div id="stick"></div></div>
<div id="actions"><button class="skill" onclick="attack()">⚔️</button><button class="skill" onclick="skill()">✦</button><button class="skill" onclick="drink()">🧪</button><button class="skill" onclick="showPanel('Quest')">📜</button></div>
<div id="menu">
 <button onclick="showPanel('Character')"><b>♙</b>Karakter</button>
 <button onclick="showPanel('Inventory')"><b>▣</b>Item</button>
 <button onclick="showPanel('Equipment')"><b>⚔</b>Equip</button>
 <button onclick="showPanel('Skill')"><b>✧</b>Skill</button>
 <button onclick="showPanel('Quest')"><b>☷</b>Quest</button>
 <button onclick="showPanel('Map')"><b>⌖</b>Map</button>
</div>
<div id="window" class="panel"><button class="close" onclick="hidePanel()">✕</button><h2 id="windowTitle"></h2><div id="windowContent"></div></div>
<div id="toast"></div>
<div id="loading"><div class="card"><h1>SECOND ISEKA ONLINE</h1><p>3D Anime Fantasy MMORPG</p><p id="loadmsg">Menyiapkan dunia 3D...</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id);
let hp=100,mp=60,xp=0,potions=5,coins=120,level=1,attacking=0;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x91c8ed);scene.fog=new THREE.Fog(0x91c8ed,35,100);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,160);
const renderer=new THREE.WebGLRenderer({canvas:$('world'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
scene.add(new THREE.HemisphereLight(0xe8f6ff,0x66734d,2));const sun=new THREE.DirectionalLight(0xffedcf,3);sun.position.set(-10,18,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function mesh(geo,material,parent,x,y,z){const o=new THREE.Mesh(geo,material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function ball(parent,r,x,y,z,c,sx=1,sy=1,sz=1){let o=mesh(new THREE.SphereGeometry(r,20,16),mat(c),parent,x,y,z);o.scale.set(sx,sy,sz);return o}
const ground=mesh(new THREE.PlaneGeometry(150,150),mat(0x79a85c),scene,0,-.06,0);ground.rotation.x=-Math.PI/2;
const path=mesh(new THREE.PlaneGeometry(5,90),mat(0xbca47e),scene,0,0,-15);path.rotation.x=-Math.PI/2;
function tree(x,z,s=1){let g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);mesh(new THREE.CylinderGeometry(.16,.25,1.5,8),mat(0x765036),g,0,.75,0);ball(g,.85,0,1.75,0,0x3c8049,1,1.1,1);ball(g,.6,-.35,2.1,0,0x579657);ball(g,.58,.4,2.05,-.1,0x4b8a50);scene.add(g)}
for(let i=0;i<44;i++){let a=i*2.399,r=13+(i%7)*2.2;tree(Math.cos(a)*r,Math.sin(a)*r-13,.8+(i%3)*.12)}
function house(x,z,roofColor){let g=new THREE.Group();g.position.set(x,0,z);mesh(new THREE.BoxGeometry(3,2.2,2.7),mat(0xe6d3b4),g,0,1.1,0);let roof=mesh(new THREE.ConeGeometry(2.3,1.6,4),mat(roofColor),g,0,3,0);roof.rotation.y=Math.PI/4;mesh(new THREE.BoxGeometry(.65,1.25,.12),mat(0x68462f),g,0,.62,1.38);scene.add(g)}
house(-8,-20,0x985444);house(7,-22,0x496b9a);house(-13,-31,0xb88742);house(13,-33,0x884d64);
for(let i=0;i<5;i++){let m=mesh(new THREE.ConeGeometry(3+i*.25,9+i,5),mat(0x8499a8),scene,-28+i*14,4,-49-(i%2)*5);m.rotation.y=.3}
for(let x of [-5,5]){mesh(new THREE.CylinderGeometry(.06,.09,2,8),mat(0x55402b),scene,x,1,-12);ball(scene,.2,x,2.1,-12,0xffd58a)}
// Hero: stylized anime adventurer, intentionally built from 3D meshes
const hero=new THREE.Group();scene.add(hero);const rig=new THREE.Group();hero.add(rig);
const skin=mat(0xf0bd9d),hair=mat(0x493026),hair2=mat(0x704631),leather=mat(0x624832),armor=mat(0x999181,.5),scarf=mat(0x9d3048),dark=mat(0x292b32),gold=mat(0xc99b4e,.35,.4);
ball(rig,.47,0,2.32,0,0xf0bd9d,.93,1,.86);ball(rig,.5,0,2.66,-.06,0x493026,1.05,.66,.96);
for(let i=0;i<10;i++){let a=i/10*Math.PI*2;ball(rig,.22,Math.cos(a)*.36,2.72+Math.sin(i*2)*.08,Math.sin(a)*.29,0x704631,1.1,1,.9)}
ball(rig,.25,-.22,2.93,.03,0x704631,1.3,.55,.85);ball(rig,.22,.12,3.01,.02,0x493026,1.1,.55,.9);
ball(rig,.055,-.16,2.38,.37,0x211815);ball(rig,.055,.16,2.38,.37,0x211815);
mesh(new THREE.BoxGeometry(.8,.75,.68),leather,rig,0,1.45,0);mesh(new THREE.BoxGeometry(.9,.18,.78),armor,rig,0,1.78,0);mesh(new THREE.BoxGeometry(.9,.18,.78),scarf,rig,0,2.02,0);mesh(new THREE.BoxGeometry(.16,.78,.12),scarf,rig,.43,1.9,-.4);
const arms=[],legs=[];
for(let side of [-1,1]){let a=new THREE.Group();a.position.set(side*.49,1.83,0);rig.add(a);mesh(new THREE.CylinderGeometry(.12,.15,.58,10),armor,a,side*.06,-.28,0);ball(a,.15,side*.08,-.57,.04,skin);ball(a,.17,side*.08,-.28,.02,leather);arms.push(a);
let l=new THREE.Group();l.position.set(side*.21,1.12,0);rig.add(l);mesh(new THREE.CylinderGeometry(.16,.19,.68,10),dark,l,0,-.3,0);ball(l,.2,0,-.68,.08,leather,1,.7,1.2);mesh(new THREE.BoxGeometry(.42,.14,.58),armor,l,0,-.84,.12);legs.push(l)}
mesh(new THREE.BoxGeometry(.08,.95,.08),mat(0xc5d8e6,.3,.7),rig,.72,1.55,.05).rotation.z=-.4;mesh(new THREE.BoxGeometry(.34,.07,.12),gold,rig,.68,1.08,.05).rotation.z=-.4;
// NPC
const npc=new THREE.Group();npc.position.set(-3,0,-9);scene.add(npc);ball(npc,.34,0,1.7,0,0xf0c39e);ball(npc,.38,0,1.98,-.02,0x85512e,1,.65,1);mesh(new THREE.BoxGeometry(.6,.78,.44),mat(0xd7c5a5),npc,0,1.08,0);mesh(new THREE.BoxGeometry(.68,.13,.5),mat(0x9d3347),npc,0,1.45,0);
// Slimes
function slime(x,z,c,size=1){let g=new THREE.Group();g.position.set(x,0,z);ball(g,.55*size,0,.47*size,0,c,1.1,.8,1);ball(g,.075*size,-.18*size,.62*size,.43*size,0x173044);ball(g,.075*size,.18*size,.62*size,.43*size,0x173044);scene.add(g);return g}
const mobs=[slime(3,-3,0x55d7a1),slime(5,-6,0x68bdf2,.82),slime(-5,-4,0x83d76a,1.12)];
const labels=[{x:-3,z:-9,t:'Mira · Guide'},{x:3,z:-3,t:'Forest Slime'},{x:5,z:-6,t:'Blue Slime'}];
let joyX=0,joyY=0,keys={};const joy=$('joy'),stick=$('stick');let pointer=null;
function joyMove(e){let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.hypot(dx,dy),k=Math.min(1,43/(len||1));joyX=dx*k/43;joyY=dy*k/43;stick.style.transform=`translate(${joyX*34}px,${joyY*34}px)`}
joy.addEventListener('pointerdown',e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);joyMove(e)});joy.addEventListener('pointermove',e=>{if(pointer===e.pointerId)joyMove(e)});function joyEnd(e){if(pointer===e.pointerId){pointer=null;joyX=joyY=0;stick.style.transform=''}}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function updateHud(){$('hpnum').textContent=hp+'/100';$('mpnum').textContent=mp+'/60';$('xpnum').textContent=xp+'/100';$('hpbar').style.width=hp+'%';$('mpbar').style.width=(mp/60*100)+'%';$('xpbar').style.width=xp+'%'}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',1900)}
window.attack=()=>{let target=mobs.find(m=>hero.position.distanceTo(m.position)<3.5);if(!target){toast('Dekati monster terlebih dahulu');return}target.position.y=.8;setTimeout(()=>{if(!target.userData.dead){target.userData.dead=true;scene.remove(target);xp+=25;coins+=12;if(xp>=100){xp-=100;level++;toast('Level Up! Sekarang Lv. '+level)}else toast('Monster dikalahkan · +25 EXP · +12 Zeny');updateHud()}},250)};
window.skill=()=>{if(mp<12){toast('MP tidak cukup');return}mp-=12;updateHud();mobs.slice().forEach(m=>{if(hero.position.distanceTo(m.position)<5){scene.remove(m);xp+=20}});toast('Skill tebasan cahaya!');updateHud()};
window.drink=()=>{if(potions<1){toast('Potion habis');return}potions--;hp=Math.min(100,hp+35);updateHud();toast('Potion digunakan · HP pulih')};
window.showPanel=(name)=>{let content='';
const rows={Character:`<div class="grid"><div class="tile"><strong>Lv. ${level}</strong>Level</div><div class="tile"><strong>Novice</strong>Job</div><div class="tile"><strong>${coins}</strong>Zeny</div><div class="tile"><strong>12</strong>STR</div><div class="tile"><strong>8</strong>AGI</div><div class="tile"><strong>10</strong>VIT</div></div><p>Petualang pemula dari dunia Second Iseka.</p>`,Inventory:`<div class="grid"><div class="tile"><strong>🧪 ×${potions}</strong>Red Potion</div><div class="tile"><strong>🍖 ×8</strong>Ransum</div><div class="tile"><strong>🪵 ×3</strong>Wood</div><div class="tile"><strong>💎 ×1</strong>Crystal</div></div>`,Equipment:`<div class="grid"><div class="tile"><strong>🗡️</strong>Novice Sword</div><div class="tile"><strong>🛡️</strong>Leather Armor</div><div class="tile"><strong>🥾</strong>Traveler Boots</div><div class="tile"><strong>🧣</strong>Red Scarf</div></div>`,Skill:`<div class="grid"><div class="tile"><strong>⚔️</strong>Basic Attack</div><div class="tile"><strong>✦</strong>Light Slash<br><small>12 MP</small></div><div class="tile"><strong>🧪</strong>Potion</div></div>`,Quest:`<b>Quest Pemula: Bersihkan Hutan</b><p>Kalahkan 3 Forest Slime untuk membantu Guide Mira.</p><p>Progress: ${Math.max(0,3-mobs.filter(m=>m.parent).length)}/3</p>`,Map:`<div class="tile"><strong>🌲 Elderwood Frontier</strong>Area pemula · Monster Lv. 1–3</div><p>Utara: Kota Aster · Timur: Ruins Dungeon (terkunci) · Selatan: Meadow Field</p>`,Menu:`<div class="grid"><div class="tile"><strong>⚙️</strong>Pengaturan</div><div class="tile"><strong>👥</strong>Party</div><div class="tile"><strong>🏰</strong>Guild</div></div><p>Prototype 3D · Build 0.1</p>`};
content=rows[name]||'<p>Konten sedang disiapkan.</p>';$('windowTitle').textContent=name;$('windowContent').innerHTML=content;$('window').style.display='block'};
window.hidePanel=()=>{$('window').style.display='none'};
let last=performance.now();
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}addEventListener('resize',resize);
function animate(now){requestAnimationFrame(animate);let dt=Math.min(.04,(now-last)/1000);last=now;let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),ky=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),x=joyX+kx,z=joyY+ky;let moving=Math.abs(x)+Math.abs(z)>.08;if(moving){hero.position.x=THREE.MathUtils.clamp(hero.position.x+x*dt*4,-18,18);hero.position.z=THREE.MathUtils.clamp(hero.position.z+z*dt*4,-34,7);hero.rotation.y=Math.atan2(x,z);rig.position.y=Math.sin(now*.012)*.045;legs[0].rotation.x=Math.sin(now*.012)*.42;legs[1].rotation.x=-Math.sin(now*.012)*.42;arms[0].rotation.x=-legs[0].rotation.x*.6;arms[1].rotation.x=-legs[1].rotation.x*.6}else{rig.position.y=Math.sin(now*.002)*.012;legs.forEach(l=>l.rotation.x*=.86);arms.forEach(a=>a.rotation.x*=.86)}mobs.forEach((m,i)=>{m.position.y=.04+Math.sin(now*.0025+i)*.08;m.rotation.y=Math.sin(now*.0008+i)*.2});npc.rotation.y=Math.sin(now*.0007)*.08;camera.position.lerp(new THREE.Vector3(hero.position.x,hero.position.y+7.8,hero.position.z+12.5),.06);camera.lookAt(hero.position.x,2,hero.position.z-1);renderer.render(scene,camera)}
requestAnimationFrame(animate);
$('loadmsg').textContent='Dunia siap · Selamat datang, Adventurer!';
setTimeout(()=>$('loading').style.display='none',900);
</script>
</body>
</html>
